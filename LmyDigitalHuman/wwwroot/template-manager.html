<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人模板管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0e27;
            --secondary-bg: #131836;
            --card-bg: rgba(19, 24, 54, 0.8);
            --accent-color: #00f3ff;
            --accent-glow: #00f3ff;
            --text-primary: #ffffff;
            --text-secondary: #8b92b8;
            --border-color: rgba(0, 243, 255, 0.3);
            --success-color: #00ff88;
            --error-color: #ff3366;
            --warning-color: #ffaa00;
        }

        body {
            font-family: 'Microsoft YaHei', 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, #1a1f4d 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1) 0%, rgba(138, 43, 226, 0.1) 100%);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 42px;
            background: linear-gradient(90deg, var(--accent-color), #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 15px 30px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            backdrop-filter: blur(10px);
        }

        .tab:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(138, 43, 226, 0.2));
            border-color: var(--accent-color);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
        }

        /* 内容区域 */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 上传卡片 */
        .upload-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background: rgba(0, 243, 255, 0.05);
        }

        .upload-area.dragover {
            border-color: var(--success-color);
            background: rgba(0, 255, 136, 0.1);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .upload-text {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 14px;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--accent-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* 按钮 */
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), #0099ff);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 243, 255, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(139, 146, 184, 0.2);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(139, 146, 184, 0.3);
            border-color: var(--accent-color);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff3366, #ff0055);
            color: #fff;
        }

        .btn-danger:hover {
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
        }

        /* 模板网格 */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .template-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.3);
            border-color: var(--accent-color);
        }

        .template-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }

        .template-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .template-info {
            padding: 20px;
        }

        .template-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .template-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .template-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .template-tag {
            padding: 5px 12px;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 15px;
            font-size: 12px;
            color: var(--accent-color);
        }

        .template-status {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-ready {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .status-processing {
            background: rgba(255, 170, 0, 0.2);
            border: 1px solid var(--warning-color);
            color: var(--warning-color);
        }

        .status-error {
            background: rgba(255, 51, 102, 0.2);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .template-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            flex: 1;
        }

        /* 加载动画 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--accent-color);
            font-size: 18px;
        }

        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            opacity: 0;
            transform: translateX(400px);
            transition: all 0.3s ease;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 200, 100, 0.2));
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .notification.error {
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(255, 0, 85, 0.2));
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .templates-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                width: 100%;
            }
        }

        /* 隐藏文件输入 */
        input[type="file"] {
            display: none;
        }

        /* 预览区域 */
        .preview-area {
            margin-top: 20px;
            display: none;
        }

        .preview-area.active {
            display: block;
        }

        .preview-container {
            position: relative;
            max-width: 400px;
            margin: 0 auto;
        }

        .preview-image {
            width: 100%;
            border-radius: 10px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }

        .preview-video {
            width: 100%;
            border-radius: 10px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }

        .remove-preview {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 51, 102, 0.9);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            line-height: 30px;
            transition: all 0.3s ease;
        }

        .remove-preview:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🎭 数字人模板管理系统</h1>
            <p>AI-Powered Digital Human Template Manager</p>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <div class="tab active" data-tab="upload">📤 上传模板</div>
            <div class="tab" data-tab="list">📋 模板列表</div>
            <div class="tab" data-tab="stats">📊 统计信息</div>
        </div>

        <!-- 上传模板 -->
        <div class="tab-content active" id="upload-tab">
            <div class="upload-card">
                <h2 style="margin-bottom: 30px; color: var(--accent-color);">创建新模板</h2>
                
                <div class="form-group">
                    <label class="form-label">资源类型</label>
                    <select id="resourceType" class="form-input">
                        <option value="image">图片模板</option>
                        <option value="video">视频模板</option>
                    </select>
                </div>

                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击或拖拽文件到此处</div>
                    <div class="upload-hint">支持 JPG, PNG（图片） 或 MP4（视频）</div>
                    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg,video/mp4">
                </div>

                <div class="preview-area" id="previewArea">
                    <div class="preview-container" id="previewContainer">
                        <button class="remove-preview" id="removePreview">×</button>
                    </div>
                </div>

                <form id="templateForm" style="margin-top: 30px;">
                    <div class="form-group">
                        <label class="form-label">显示名称（中文）*</label>
                        <input type="text" id="displayName" class="form-input" placeholder="例如：小美" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">系统名称（英文）*</label>
                        <input type="text" id="systemName" class="form-input" placeholder="例如：xiaomei" required pattern="[a-zA-Z0-9_-]+">
                        <small style="color: var(--text-secondary); font-size: 12px;">只能包含英文字母、数字、下划线和连字符</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <textarea id="description" class="form-input" rows="3" placeholder="简短描述这个模板..."></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">性别</label>
                            <select id="gender" class="form-input">
                                <option value="neutral">中性</option>
                                <option value="female">女性</option>
                                <option value="male">男性</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">年龄段</label>
                            <select id="ageRange" class="form-input">
                                <option value="adult">成年</option>
                                <option value="young">青年</option>
                                <option value="elderly">老年</option>
                                <option value="child">儿童</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">风格</label>
                            <select id="style" class="form-input">
                                <option value="professional">专业</option>
                                <option value="friendly">友好</option>
                                <option value="casual">休闲</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 30px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">
                            🚀 创建模板
                        </button>
                        <button type="button" class="btn btn-secondary" id="resetBtn">
                            🔄 重置
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 模板列表 -->
        <div class="tab-content" id="list-tab">
            <div class="upload-card">
                <h2 style="margin-bottom: 20px; color: var(--accent-color);">我的模板</h2>
                <div class="templates-grid" id="templatesGrid">
                    <p style="text-align: center; color: var(--text-secondary); padding: 40px;">加载中...</p>
                </div>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="tab-content" id="stats-tab">
            <div class="upload-card">
                <h2 style="margin-bottom: 20px; color: var(--accent-color);">统计信息</h2>
                <div id="statsContent">
                    <p style="text-align: center; color: var(--text-secondary); padding: 40px;">加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">处理中...</div>
        </div>
    </div>

    <!-- 通知 -->
    <div class="notification" id="notification"></div>

    <script src="/js/template-manager.js"></script>
</body>
</html>
